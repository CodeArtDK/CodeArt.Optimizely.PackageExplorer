<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeArts Optimizely CMS Package Explorer</title>
    <base href="/CodeArt.Optimizely.PackageExplorer/" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="favicon.ico" />
    <link href="CodeArt.Optimizely.PackageExplorer.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/prism.css" rel="stylesheet" />
    <style>
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f8fa;
            z-index: 9999;
        }

        .spin {
            width: 64px;
            height: 64px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .system-property {
            background-color: #e8f0fe; /* light blue background */
            font-style: italic;
        }

        pre code {
            display: block;
            overflow-x: auto;
            padding: 1rem;
            white-space: pre;
            word-break: normal;
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="loader">
            <img src="logo.png" alt="Loading..." class="spin" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Register service worker with update handling
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(function(registration) {
                    console.info('Service Worker registered with scope:', registration.scope);
                    
                    // Check for updates every hour
                    setInterval(function() {
                        registration.update();
                    }, 60 * 60 * 1000);
                    
                    // Check for updates on page load
                    registration.update();
                    
                    // Listen for waiting service worker (new version available)
                    registration.addEventListener('updatefound', function() {
                        const newWorker = registration.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker installed, reload to activate
                                    console.info('New service worker available, reloading...');
                                }
                            });
                        }
                    });
                })
                .catch(function(error) {
                    console.error('Service Worker registration failed:', error);
                });
            
            // Reload page when new service worker takes control
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (!refreshing) {
                    refreshing = true;
                    console.info('New service worker activated, reloading page...');
                    window.location.reload();
                }
            });
        }
    </script>
    <script src="js/prism.js"></script>
    <script>
        window.highlightCode = function () {
            if (window.Prism && Prism.highlightAll) {
                Prism.highlightAll();
            } else {
                console.warn("Prism not loaded");
            }
        };
    </script>
    <script src="js/media.js"></script>
    <script src="js/fileDownload.js"></script>
</body>

</html>
